name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs vp, Node (from .node-version) and pnpm, then runs `vp install`
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      - name: Check (format, lint, types)
        run: pnpm check

      - name: Test
        run: pnpm test --run

      - name: Build
        run: pnpm build
